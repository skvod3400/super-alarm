name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk super-alarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: super-alarm
          path: super-alarm.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тестовая сборка ${{ github.run_number }}
          body: Тестовая версия «Супербудильник (тест)». Скачайте super-alarm.apk на телефон и установите.
          prerelease: true
          files: super-alarm.apk
