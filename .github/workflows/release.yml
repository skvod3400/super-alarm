name: Release for RuStore

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Добавьте секреты RELEASE_KEYSTORE_BASE64 и RELEASE_KEYSTORE_PASSWORD в настройках репозитория"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: superalarm
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir rustore
          cp app/build/outputs/apk/release/app-release.apk rustore/super-alarm.apk
          cp app/build/outputs/bundle/release/app-release.aab rustore/super-alarm.aab

      - uses: actions/upload-artifact@v4
        with:
          name: super-alarm-rustore
          path: rustore/
